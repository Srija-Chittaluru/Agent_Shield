steps:
- id: greet
  kind: say
  next: ask_good_time
  prompt:
    en-US:
      say:
        intent: say who is calling and which organisation they are from, that this is about
          their yearly Medi-Cal renewal, that the call is recorded, and that it will only
          take a couple of minutes
        examples:
        - Hello, this is {client.agent_name} calling from {client.business_entity} about your
          yearly Medi-Cal renewal. This call is recorded, and it'll only take a couple of
          minutes.
        max_words: 45
- id: ask_good_time
  kind: ask
  next: route_good_time
  field:
    key: good_time
    type: yes_no
    label: availability
    save_to: answer.good_time
    rules:
      normalize:
        negative_extra:
        - another time
        - some other time
        - not now
        - not right now
        - not today
        - later
        - i'd rather not
        - id rather not
        - rather not
        - not interested
        - no thanks
        - no thank you
        - maybe later
        - some other day
  answer:
    on_decline: goto:say_another_time
    on_exhaust: advance
  status: Retry Scheduled | In Progress
  prompt:
    en-US:
      ask:
        text: Would you have a couple of minutes to talk about your Medi-Cal renewal?
      reask:
        text: Would you have a couple of minutes to talk about your Medi-Cal renewal?
      clarify:
        intent: answer what they asked in a sentence or two; if you cannot answer it, say
          you would like to answer their question about that topic properly once you know
          you are speaking with the right person, naming the topic back in a few words — then
          ask again whether now is a good time
      declined:
        text: No problem at all — we'll try you again another time. Have a good day.
- id: route_good_time
  kind: branch
  cases:
  - when: answer.good_time == "No"
    label: not a good time
    goto: say_another_time
  default: ask_identity
- id: say_another_time
  kind: say
  next: end_another_time
  prompt:
    mode: verbatim
    en-US:
      say:
        text: No problem at all — we'll try you again another time. Have a good day.
- id: end_another_time
  kind: end
  status: Retry Scheduled | In Progress
- id: ask_identity
  kind: ask
  next: route_identity
  field:
    key: is_patient
    type: yes_no
    label: identity
    save_to: answer.is_patient
    rules:
      normalize:
        negative_extra:
        - not me
        - that's not me
        - thats not me
        - i'm not
        - im not
        - i am not
        - he's not here
        - hes not here
        - she's not here
        - shes not here
        - they're not here
        - theyre not here
        - not here
        - not available
        - not in
        - isn't here
        - isnt here
        - doesn't live here
        - doesnt live here
        - no longer lives here
        - moved out
        - speaking to the wrong person
  answer:
    on_decline: goto:say_dob_declined
    on_exhaust: goto:say_dob_declined
  status: Contacted | Needs Review
  prompt:
    en-US:
      ask:
        text: May I please speak with {user.first_name}?
      reask:
        text: May I please speak with {user.first_name}?
      clarify:
        intent: answer what they asked in a sentence or two; if you cannot answer it, say
          you will come straight back to their question about that topic in a moment, naming
          the topic back in a few words — then ask again whether you are speaking with {user.first_name}
      declined:
        text: That's no trouble at all — we'll try again another time. Have a good day.
- id: route_identity
  kind: branch
  cases:
  - when: answer.is_patient == "No"
    label: not the patient
    goto: ask_reach_patient
  default: ask_dob
- id: ask_reach_patient
  kind: ask
  next: route_reach_patient
  field:
    key: can_reach_patient
    type: yes_no
    label: reaching the patient
    save_to: answer.can_reach_patient
  answer:
    on_decline: goto:say_dob_declined
    on_exhaust: goto:say_dob_declined
  prompt:
    en-US:
      ask:
        text: No problem at all — is {user.first_name} available to come to the phone?
      reask:
        text: Is {user.first_name} available to come to the phone?
      clarify:
        intent: answer what they asked in a sentence or two; if you cannot answer it, say
          you can only go through the details with {user.first_name} themselves — then ask
          again whether they are available to come to the phone
      declined:
        text: That's no trouble at all — we'll try again another time. Have a good day.
- id: route_reach_patient
  kind: branch
  cases:
  - when: answer.can_reach_patient == "Yes"
    label: they are coming to the phone
    goto: ask_dob
  default: say_try_again_later
- id: ask_dob
  kind: ask
  next: route_dob
  field:
    key: dob
    type: date
    label: date of birth
    save_to: answer.dob
    rules:
      confirm:
        mode: none
  answer:
    max_attempts: 2
    on_decline: goto:say_dob_declined
    on_exhaust: advance
    record_as: NA
  prompt:
    en-US:
      ask:
        text: Just so I know I'm speaking with the right person, could you please share your
          date of birth?
      reask:
        text: Sorry — I want to make sure I heard that right. Could you please say your date
          of birth once more?
      clarify:
        intent: answer what they asked in a sentence or two; if you cannot answer it, say
          you will answer their question about that topic as soon as you know you are speaking
          with the right person, naming the topic back in a few words — then ask again for
          their date of birth
- id: route_dob
  kind: branch
  cases:
  - when: answer.dob == user.dob
    label: date matches
    goto: thank_for_verifying
  - when: answer.dob != user.dob
    label: ask once more
    goto: ask_dob
    again: true
  default: say_dob_failed
- id: thank_for_verifying
  kind: say
  prompt:
    mode: verbatim
    en-US:
      say:
        text: Thank you for verifying that, {user.first_name}.
  next: ask_packet_received
- id: say_try_again_later
  kind: say
  next: end_not_reached
  prompt:
    mode: verbatim
    en-US:
      say:
        text: That's no trouble at all — we'll try again another time. Thank you, and have
          a good day.
- id: say_dob_declined
  kind: say
  next: end_unverified
  prompt:
    mode: verbatim
    en-US:
      say:
        text: That's alright, {user.first_name} — someone from the clinic will give you a
          call to go through it with you instead. Have a good day.
- id: say_dob_failed
  kind: say
  next: end_unverified
  prompt:
    mode: verbatim
    en-US:
      say:
        text: Thanks for bearing with me, {user.first_name} — the date of birth we have on
          file doesn't quite match, so someone from the clinic will reach out to help sort
          it out. Have a good day.
- id: end_unverified
  kind: end
  status: Contacted | Needs Review
- id: end_not_reached
  kind: end
  status: Retry Scheduled | In Progress
- id: ask_packet_received
  kind: ask
  field:
    key: packet_received
    type: yes_no
    label: renewal packet
    save_to: answer.packet_received
  prompt:
    en-US:
      ask:
        text: Santa Rosa Community Health sent you a Medi-Cal renewal packet about three weeks
          ago, to {user.address}. Did that reach you?
      reask:
        text: Did that reach you?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether the renewal
          packet reached them
- id: route_packet
  kind: branch
  cases:
  - when: answer.packet_received == "No"
    goto: ask_address_ok
    label: packet never arrived
  default: ask_already_sent
- id: ask_address_ok
  kind: ask
  field:
    key: address_ok
    type: yes_no
    label: address on file
    save_to: answer.address_ok
  prompt:
    en-US:
      ask:
        text: Sorry to hear that. Just to confirm — is {user.address} still your current address?
      reask:
        text: Is {user.address} still your current address?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether the address
          we have on file is still their current address
- id: route_address
  kind: branch
  cases:
  - when: answer.address_ok == "Yes"
    goto: close_clinic_will_look
    label: address correct, delivery failed
  default: ask_new_address
- id: ask_new_address
  kind: ask
  field:
    key: new_address
    type: address
    label: best address to use now
    save_to: answer.new_address
  answer:
    max_attempts: 3
    max_reopens: 2
  prompt:
    en-US:
      ask:
        text: That happens quite often, and it's an easy one to sort out — it usually just
          means the letter went to an older address. Could you share the best address to use
          for you now, please?
      reask:
        text: Could you share the best address to use for you now, please?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again for the best address
          to use for them now
      readback:
        text: So that's {spoken} — have I got that right?
        verbatim_value: true
- id: close_no_packet
  kind: say
  prompt:
    mode: verbatim
    en-US:
      say:
        text: Thank you, {user.first_name} — I've noted the new address, and someone from
          the clinic will update it with the county and reach out to you about the packet
          at your new place. Have a good day.
- id: end_no_packet
  kind: end
  status: Contacted | Needs Review
- id: close_clinic_will_look
  kind: say
  prompt:
    mode: verbatim
    en-US:
      say:
        text: No worries, someone from the clinic will look into this and get back to you.
          Thank you for your time.
- id: end_packet_delivery_failed
  kind: end
  status: Contacted | Needs Review
- id: ask_already_sent
  kind: ask
  field:
    key: already_sent
    type: yes_no
    label: renewal form
    save_to: answer.already_sent
  prompt:
    en-US:
      ask:
        text: Have you already sent the renewal back to the county?
      reask:
        text: Have you already sent the renewal back to the county?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether they have
          already sent the renewal back to the county
- id: route_sent
  kind: branch
  cases:
  - when: answer.already_sent == "Yes"
    goto: ask_anything_to_check
    label: already sent
  default: ask_online_account
- id: ask_anything_to_check
  kind: ask
  field:
    key: anything_to_check
    type: yes_no
    label: anything to check
    save_to: answer.anything_to_check
  answer:
    loop_while: 'Yes'
    max_rounds: 10
    max_clarifications: 20
  prompt:
    en-US:
      ask:
        text: That's wonderful to hear — the county will follow up with you directly. Is there
          anything you'd like to check about the form or what happens next before we finish?
      invite:
        intent: invite them to ask what they wanted to check, warmly and in one short sentence
          — do not answer anything yet and do not ask whether they have a question, they have
          just said they do
      reask:
        text: Is there anything you'd like to check?
      clarify:
        intent: answer what they asked in a sentence or two, then ask whether there is anything
          else they would like to check
- id: close_already_sent
  kind: say
  prompt:
    mode: verbatim
    en-US:
      say:
        text: That's wonderful — the county will follow up with you directly. If any questions
          come up in the meantime, the clinic is always here to help. Have a good day, {user.first_name}.
- id: end_already_sent
  kind: end
  status: Contacted | Completed
- id: ask_online_account
  kind: ask
  field:
    key: wants_online_account
    type: yes_no
    label: online county account
    save_to: answer.wants_online_account
  prompt:
    en-US:
      ask:
        text: Some people prefer to handle this themselves online. Would you like to set up
          your own account on the county's website? A counsellor can stay on the line and
          walk you through it, and once you have it you can check your Medi-Cal any time —
          not just this year.
      reask:
        text: Would you like to set up your own account on the county's website?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether they would
          like to set up their own account on the county's website
- id: route_online_account
  kind: branch
  cases:
  - when: answer.wants_online_account == "Yes"
    goto: ask_has_email
    label: wants an account
  default: ask_more_questions
- id: ask_has_email
  kind: ask
  field:
    key: has_prereqs
    type: yes_no
    label: email and a device
    save_to: answer.has_prereqs
  prompt:
    en-US:
      ask:
        text: Wonderful. Just two quick things first — do you have an email address you can
          get into, and are you on a phone or a computer right now?
      reask:
        text: Do you have an email you can get into, and are you on a phone or a computer?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether they have
          an email address they can get into and whether they are on a phone or a computer
          right now
- id: route_prereqs
  kind: branch
  cases:
  - when: answer.has_prereqs == "Yes"
    goto: close_counsellor_setup
    label: ready to set it up
  default: ask_more_questions
- id: close_counsellor_setup
  kind: say
  next: route_counsellor_direct
  prompt:
    mode: verbatim
    en-US:
      say:
        text: I'll connect you to a counsellor now — the call will stay recorded, and they'll
          walk you through setting it up.
- id: route_counsellor_direct
  kind: branch
  cases:
  - when: desk_is_open == "No"
    goto: close_counsellor_closed
    label: desk is closed
  default: end_counsellor_transfer
- id: end_counsellor_setup
  kind: end
  status: Contacted | Needs Review
- id: route_counsellor_hours
  kind: branch
  cases:
  - when: desk_is_open == "No"
    goto: close_counsellor_closed
    label: desk is closed
  default: offer_counsellor
- id: offer_counsellor
  kind: ask
  next: route_counsellor
  field:
    key: wants_counsellor
    type: yes_no
    label: speaking to a person
    save_to: answer.wants_counsellor
    rules:
      hints:
        patience_ms: 800
  answer:
    requirement: required
    on_exhaust: goto:declined_counsellor
    on_decline: goto:declined_counsellor
  prompt:
    en-US:
      ask:
        text: Of course — shall I put you through to a counsellor now?
      reask:
        intent: ask again whether they would like to be put through to a counsellor
      clarify:
        intent: answer what they asked in a sentence, then ask again whether they would like
          to be put through to a counsellor
      declined:
        intent: say that is no problem, and that you can carry on together
- id: route_counsellor
  kind: branch
  cases:
  - when: answer.wants_counsellor == "Yes"
    label: wants a person
    goto: say_connecting_counsellor
  default: declined_counsellor
- id: say_connecting_counsellor
  kind: say
  next: end_counsellor_transfer
  prompt:
    mode: verbatim
    en-US:
      say:
        text: Putting you through now — please stay on the line. The call stays recorded.
- id: end_counsellor_transfer
  kind: end
  status: Contacted | Needs Review
  transfer:
    destination: human_agent
    mode: stay
    timeout_seconds: 30
    handoff_note: Medi-Cal renewal call; caller asked for a counsellor.
    on_failure: Transfer Failed | Needs Review
- id: declined_counsellor
  kind: say
  prompt:
    en-US:
      say:
        intent: say that is no problem and that you will carry on together
        examples:
        - No problem at all — let's carry on.
        max_words: 20
  next: ask_more_questions
- id: close_counsellor_closed
  kind: say
  next: end_counsellor_setup
  prompt:
    en-US:
      say:
        intent: say the counsellors have finished for the day, that one will call them back,
          and close the call warmly
        examples:
        - The counsellors have finished for today — one of them will call you back tomorrow.
        max_words: 28
- id: say_bereavement_connect
  kind: say
  next: end_bereavement_transfer
  prompt:
    mode: verbatim
    en-US:
      say:
        text: I'm so sorry. I'm not going to make you go through that on this call — let me
          get you to a person who can handle it with you. I'll connect you to a counsellor
          right now, and the call stays recorded.
- id: end_bereavement_transfer
  kind: end
  status: Contacted | Needs Review
  transfer:
    mode: stay
    timeout_seconds: 30
    handoff_note: Bereavement disclosed on a Medi-Cal renewal call. Please take this gently.
    on_failure: Transfer Failed | Needs Review
- id: say_incarceration_connect
  kind: say
  next: end_incarceration_transfer
  prompt:
    mode: verbatim
    en-US:
      say:
        text: That's on the form and it does affect things. Let me get you to a specialist
          rather than guess at it. I'll connect you to a counsellor right now, and the call
          stays recorded.
- id: end_incarceration_transfer
  kind: end
  status: Contacted | Needs Review
  transfer:
    mode: stay
    timeout_seconds: 30
    handoff_note: Incarceration disclosed on a Medi-Cal renewal call; needs a specialist.
    on_failure: Transfer Failed | Needs Review
- id: ask_more_questions
  kind: ask
  field:
    key: more_questions
    type: yes_no
    label: questions about the form
    save_to: answer.more_questions
  answer:
    max_attempts: 2
    max_clarifications: 20
    loop_while: 'Yes'
    max_rounds: 10
  prompt:
    en-US:
      ask:
        text: Do you have any questions about the form while I'm here?
      invite:
        intent: invite them to go ahead and ask, warmly and in one short sentence — do not
          answer anything yet, and do not ask whether they have a question, because they have
          just said they do; vary the wording so it does not sound recited
      reask:
        text: Is there anything else I can help you with?
      clarify:
        intent: answer what they asked in a sentence or two, then ask whether there is anything
          else they would like to check — vary the wording so it does not sound recited
- id: ask_send_date
  kind: ask
  field:
    key: send_date
    type: free_text
    label: day you'll send it in
    save_to: answer.send_date
  answer:
    requirement: optional
    max_attempts: 2
  prompt:
    en-US:
      ask:
        text: Which day are you thinking you'll send it in? Most people find it easiest to
          finish within a week, and I could check back with you around then to see how it's
          going, if that would help.
      reask:
        text: Which day are you thinking you'll send it in?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again which day they
          are thinking they'll send the renewal in
- id: closing
  kind: say
  prompt:
    en-US:
      say:
        intent: 'thank them by name, say you will check back around the day they said they
          would send it in, and wish them well — but if they gave no day, or a day on or after
          the 28th of October, do not promise a check-in date at all: just thank them, say
          the clinic is there if they need help, and close'
        must_not_say:
        - 30th of October
        - October 30
        - the due date
        examples:
        - Thank you, {user.first_name} — I'll check back with you around then to see how it's
          going. Good luck getting it in.
        - Thank you, {user.first_name} — good luck getting it in, and please give the clinic
          a call anytime if you need help. Have a good day.
        max_words: 45
- id: done
  kind: end
  status: Contacted | Completed
- id: ask_agent_verified
  kind: ask
  field:
    key: agent_verified
    type: yes_no
    label: whether the name on file matches
    save_to: answer.agent_verified
  answer:
    max_attempts: 2
    on_decline: goto:resume
    on_exhaust: goto:resume
    record_as: NA
  prompt:
    en-US:
      ask:
        text: Of course — you should check. The last name we have on file for you is {user.last_name}.
          Does that match what you'd expect?
      reask:
        text: Sorry, I didn't catch that — the last name we have for you is {user.last_name}.
          Does that match?
      clarify:
        intent: answer what they asked in a sentence or two, then ask again whether the last
          name you gave them matches what they would expect
      declined:
        text: That's alright — let's carry on, and thank you for checking.
- id: route_agent_verified
  kind: branch
  cases:
  - when: answer.agent_verified == 'Yes'
    label: the caller is satisfied
    goto: resume
  default: ask_agent_verified_again
- id: ask_agent_verified_again
  kind: ask
  field:
    key: agent_verified_retry
    type: yes_no
    label: whether the name on file matches
    save_to: answer.agent_verified_retry
  answer:
    max_attempts: 2
    on_decline: goto:resume
    on_exhaust: goto:say_cannot_prove
    record_as: NA
  prompt:
    en-US:
      ask:
        text: Let me say it once more — the last name on your record with us is {user.last_name}.
          Does that sound right?
      reask:
        text: 'Sorry — once more: we have {user.last_name} as the last name on your record.
          Is that right?'
      declined:
        text: That's alright — let's carry on, and thank you for checking.
- id: route_agent_verified_again
  kind: branch
  cases:
  - when: answer.agent_verified_retry == 'Yes'
    label: satisfied on the second try
    goto: resume
  default: say_cannot_prove
- id: say_cannot_prove
  kind: say
  prompt:
    en-US:
      say:
        text: I understand, and I'd rather not push it — it sounds like something isn't matching
          up. I'll leave this with the clinic and someone will get back to you shortly. Thanks
          for your time, and take care.
  next: end_unverified
